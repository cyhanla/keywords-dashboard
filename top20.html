const previous = d.slice(-30, -15);
const recentAvg = recent.reduce((a,b)=>a+b.value,0)/15;
const previousAvg = previous.reduce((a,b)=>a+b.value,0)/15;
const growth = previousAvg ? ((recentAvg - previousAvg)/previousAvg*100) : 0;
return {
keyword: kw,
current: recent[14].value,
recentAvg: Math.round(recentAvg),
previousAvg: Math.round(previousAvg),
growth: Math.round(growth*100)/100
};
}

const allGrowth = keywords.map(calcGrowth).sort((a,b)=>b.growth-a.growth);
const trending = allGrowth.filter(x=>x.growth>=15);

document.getElementById('trendingCount').textContent = trending.length;
document.getElementById('maxGrowth').textContent = trending.length>0 ? '+'+trending[0].growth+'%' : '0%';

const listEl = document.getElementById('trendingList');
if (trending.length === 0) {
listEl.innerHTML = '<div class="p-4 text-center text-gray-500">暂无趋势上升的关键词</div>';
} else {
listEl.innerHTML = trending.map(item => `
<div class="p-3 hover:bg-gray-50 cursor-pointer transition-colors" onclick="showKeywordChart('${item.keyword}')">
<div class="flex items-center justify-between">
<span class="font-medium text-gray-900">${item.keyword}</span>
<span class="text-green-600 font-bold">+${item.growth}%</span>
</div>
<div class="text-sm text-gray-500 mt-1">当前: ${item.current} | 近期平均: ${item.recentAvg}</div>
</div>
`).join('');
}

let chart = null;
let currentKeyword = null;

function showKeywordChart(keyword) {
if (!keywordsData[keyword]) return;
currentKeyword = keyword;
const data = keywordsData[keyword];
const growth = calcGrowth(keyword);

document.getElementById('chartTitle').textContent = keyword + ' - 趋势图表';
document.getElementById('timeRangeButtons').style.display = 'flex';
document.getElementById('keywordDetail').classList.remove('hidden');
document.getElementById('detailCurrent').textContent = growth.current;
document.getElementById('detailRecent').textContent = growth.recentAvg;
const growthEl = document.getElementById('detailGrowth');
growthEl.textContent = (growth.growth>0?'+':'') + growth.growth + '%';
growthEl.className = 'text-xl font-bold ' + (growth.growth>0?'text-green-600':'text-red-600');

drawChart(data, 30);
}

function drawChart(data, days) {
const ctx = document.getElementById('trendChart').getContext('2d');
const recentData = data.slice(-days);
const labels = recentData.map(d => d.date.slice(5));
const values = recentData.map(d => d.value);

if (chart) chart.destroy();
chart = new Chart(ctx, {
type: 'line',
data: {
labels: labels,
datasets: [{
label: '搜索指数',
data: values,
borderColor: '#3b82f6',
backgroundColor: 'rgba(59,130,246,0.1)',
borderWidth: 2,
fill: true,
tension: 0.4,
pointRadius: 0,
pointHoverRadius: 4}]
},
options: {
responsive: true,
maintainAspectRatio: false,
interaction: {intersect: false, mode: 'index'},
plugins: {legend: {display: false}},
scales: {
x: {grid: {display: false}, ticks: {maxTicksLimit: 10}},
y: {beginAtZero: true, grid: {color: '#f3f4f6'}}
}
}
});
}

function setTimeRange(days) {
if (currentKeyword) {
drawChart(keywordsData[currentKeyword], days);
}
}

function searchKeyword() {
const query = document.getElementById('searchInput').value.trim();
if (!query) return;

const results = keywords.filter(k => k.includes(query));
const resultsDiv = document.getElementById('searchResults');
const listDiv = document.getElementById('searchResultsList');

if (results.length === 0) {
listDiv.innerHTML = '<span class="text-gray-500">未找到相关关键词</span>';
} else if (results.length === 1) {
showKeywordChart(results[0]);
resultsDiv.classList.add('hidden');
return;
} else {
listDiv.innerHTML = results.map(k => `
<button onclick="showKeywordChart('${k}');document.getElementById('searchResults').classList.add('hidden');" 
class="px-3 py-1 bg-blue-100 text-blue-700 rounded-full text-sm hover:bg-blue-200">${k}</button>
`).join('');
}
resultsDiv.classList.remove('hidden');
}

document.getElementById('searchInput').addEventListener('keypress', (e) => {
if (e.key === 'Enter') searchKeyword();
});

if (trending.length > 0) {
showKeywordChart(trending[0].keyword);
}
</script>
</body>
</html>
